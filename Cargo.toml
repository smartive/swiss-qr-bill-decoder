[package]
name = "swiss-qr-bill-decoder"
version = "1.4.1"
edition = "2021"
publish = false
authors = ["Mike Schmid <mike@smartive.ch>"]
description = "A simple tool to decode QR codes of Swiss QR bills"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde_json = "=1.0.154"
rqrr = "=0.11.0"
image = "=0.25.10"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
rayon = "=1.12.0"

[dev-dependencies]
indoc = "=2.0.8"
