name: Test

env:
  PROJECT_NAME: swiss-qr-bill-decoder
  CARGO_TERM_COLOR: always

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: "${{ matrix.platform.target }}"

    - name: Install cross
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
      if: matrix.platform.cross
      with:
        tool: cross

    - name: Rust (Cargo) Caching
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Build
      env:
        CARGO: ${{ matrix.platform.cross && 'cross' || 'cargo' }}
      run: |
        $CARGO test \
          --target ${{ matrix.platform.target }} \
          --no-run \
          --locked

    - name: Run tests
      env:
        CARGO: ${{ matrix.platform.cross && 'cross' || 'cargo' }}
      run: |
        $CARGO test \
          --target ${{ matrix.platform.target }} \
          --locked
