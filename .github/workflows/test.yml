name: Test

env:
  PROJECT_NAME: swiss-qr-bill-decoder
  CARGO_TERM_COLOR: always

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: "${{ matrix.platform.target }}"

    - name: Install cross
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      if: matrix.platform.cross
      with:
        tool: cross

    - name: Rust (Cargo) Caching
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build
      env:
        CARGO: ${{ matrix.platform.cross && 'cross' || 'cargo' }}
      run: |
        $CARGO test \
          --target ${{ matrix.platform.target }} \
          --no-run \
          --locked

    - name: Run tests
      env:
        CARGO: ${{ matrix.platform.cross && 'cross' || 'cargo' }}
      run: |
        $CARGO test \
          --target ${{ matrix.platform.target }} \
          --locked
