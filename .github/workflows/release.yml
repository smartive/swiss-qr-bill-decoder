---
name: Release

on:
  push:
    branches:
      - main
      - next
      - next-major
      - beta
      - alpha
      - "[0-9]+.[0-9]+.x"
      - "[0-9]+.x"

jobs:
  release:
    uses: semantic-release-action/rust/.github/workflows/release-binary.yml@4e89b88c46d9439fd63dc0c08ee635b2c6ab1aad # v5
    with:
      disable-semantic-release-cargo: true
      targets: |
        aarch64-apple-darwin
        aarch64-unknown-linux-gnu
        aarch64-unknown-linux-musl
        i686-unknown-linux-gnu
        i686-unknown-linux-musl
        x86_64-apple-darwin
        x86_64-unknown-linux-gnu
        x86_64-unknown-linux-musl
